<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infernal Brocolli 😈🥦</title>
    <style>
        body {
            background-color: blue;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #brocco {
            background-color: green;
            height: 250px;
            width: 250px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #li {
            text-align: center;
            background-color: rgb(255, 0, 0);
            width: 100%;
            bottom: 0;
        }

        #li h1 {
            color: white;
            margin: 0;
        }

        #criminal {
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
        }
    </style>
</head>

<body>
    <div id="brocco">
        <div id="criminal">
            <h1>🥦</h1>
        </div>
        <div id="li">
            <h1>Broccoli 🥦</h1>
        </div>
    </div>
</body>
</html>
